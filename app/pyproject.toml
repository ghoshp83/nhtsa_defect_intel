[project]
name = "nhtsa-defect-chat"
version = "0.1.0"
description = "Streamlit chat UI for the NHTSA Defect Intelligence agent serving endpoint."
requires-python = ">=3.12, <3.13"
# Pins mirror the root nhtsa-curator pyproject.toml where they overlap so
# the App and the agent share the same SDK / OpenAI / MLflow wire format.
# Streamlit is App-only and not in the root project.
dependencies = [
    "streamlit==1.39.0",
    "databricks-sdk==0.85.0",
    "openai==2.8.0",
    "mlflow==3.8.1",
]

[build-system]
requires = ["setuptools>=72.0"]
build-backend = "setuptools.build_meta"
