# Genie space configuration snapshot (declarative reference).
#
# Genie spaces are *created interactively in the UI* — there is no
# public DDL. This file is the human-readable record of how the space
# is wired so a teammate can recreate it deterministically.
#
# Notebook 3.2 emits the same content programmatically (table list,
# trusted-query SQL, manual recipe) so the YAML and the notebook stay
# in lockstep. Update both when the space changes.

space:
  name_template: "NHTSA Defect Intelligence ({env})"
  warehouse_id_from: cfg.warehouse_id

  # Tables exposed (must match nhtsa_curator.genie.GENIE_TABLES exactly).
  tables:
    - dim_vehicle
    - dim_component
    - dim_oem_group
    - dim_date
    - gold_recalls_fact
    - gold_complaints_fact
    - gold_investigations_fact

  # Pasted into the Genie space "general instructions" panel.
  general_instructions: |
    Always cite source IDs (campaign_number, odi_number,
    nhtsa_action_number) inline in answers.

    When a question mentions a manufacturer (e.g. "GM", "Stellantis"),
    join via dim_oem_group rather than dim_vehicle.make_norm — the
    user is asking about a corporate parent, not a single brand.

    Dates default to event_date on the fact tables (owner_notify_date
    for recalls, incident_date for complaints, open_date for
    investigations). Use dim_date when the user asks for week / month
    / quarter aggregates.

    Counts: use COUNT(DISTINCT campaign_number) for "how many
    recalls" — a single campaign expands to multiple fact rows.

  # Trusted-query seeds. Notebook 3.2 prints these for paste-into-UI;
  # keep names + questions in sync between the two files.
  trusted_queries:
    - name: recalls_by_make_year
      question: "How many recall campaigns were issued for Tesla vehicles in 2023?"
    - name: complaints_with_fire_by_oem_group
      question: "Which OEM groups had the most fire-related complaints in the last 3 years?"
    - name: open_investigations_by_component
      question: "What component groups have the most open investigations right now?"
    - name: injuries_per_make_per_year
      question: "Total reported injuries from complaints, by make, by year — last 5 years."
    - name: recall_campaigns_units_by_component
      question: "Top 10 component groups by units recalled (all-time)."

  # After the space is created in the UI, copy the space-id from the
  # URL into project_config.yml under the matching env's
  # `genie_space_id`. Notebook 3.2 verifies the wiring.
  space_id_storage: project_config.yml::<env>.genie_space_id
